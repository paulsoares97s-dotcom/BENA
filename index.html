<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04070F">
<link rel="manifest" id="manifest-link" href="/api/manifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Dashboard</title>
<script>
  // Le manifest suit le lien ouvert : l'icône de l'écran d'accueil rouvre le bon espace.
  (function () {
    var q = new URLSearchParams(location.search), s = '';
    if (q.get('admin')) s = '?admin=' + encodeURIComponent(q.get('admin'));
    else if (q.get('p')) s = '?p=' + encodeURIComponent(q.get('p'));
    document.getElementById('manifest-link').href = '/api/manifest' + s;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #04070F;
    --bg: #0A0E1A;
    --card: #0D1222;
    --card-2: #121831;
    --line: #1A2140;
    --line-2: #262F55;
    --text: #F4F5FA;
    --dim: #8B92B5;
    --dimmer: #565C83;
    --gold: #F5C542;
    --gold-2: #FFE08A;
    --gold-soft: rgba(245, 197, 66, 0.12);
    --green: #2EE59D;
    --green-soft: rgba(46, 229, 157, 0.12);
    --red: #FF5C6C;
    --red-soft: rgba(255, 92, 108, 0.12);
    --blue: #7AA2FF;
    --blue-soft: rgba(122, 162, 255, 0.12);
    --radius: 22px;
    --serif: 'Instrument Serif', Georgia, serif;
  }
  [hidden] { display: none !important; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg-deep); color: var(--text); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
  body {
    min-height: 100vh; overflow-x: hidden; font-feature-settings: 'ss01', 'cv11', 'tnum';
    background:
      radial-gradient(ellipse 90% 50% at 50% -10%, rgba(245, 197, 66, 0.08), transparent 70%),
      radial-gradient(ellipse 60% 40% at 100% 70%, rgba(122, 162, 255, 0.04), transparent 70%),
      var(--bg-deep);
    padding: max(22px, env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  @media (min-width: 900px) { .wrap { max-width: 980px; } .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .grid-2 > .card { margin-bottom: 0; } .grid-2 { margin-bottom: 14px; } }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* ---------- En-tête ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar { width: 42px; height: 42px; border-radius: 14px; flex: none; display: grid; place-items: center; font-family: var(--serif); font-size: 24px; color: #1a1300; background: linear-gradient(140deg, var(--gold-2), var(--gold) 55%, #B8860B); box-shadow: 0 6px 24px rgba(245, 197, 66, 0.25); }
  .who { min-width: 0; }
  .who-name { font-family: var(--serif); font-size: 26px; line-height: 1; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who-sub { font-size: 11px; color: var(--dim); margin-top: 4px; letter-spacing: 0.3px; }
  .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 0 0 rgba(46, 229, 157, 0.6); animation: pulse 2.4s infinite; }
  .live-dot.off { background: var(--dimmer); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46, 229, 157, 0.5); } 70% { box-shadow: 0 0 0 7px rgba(46, 229, 157, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 229, 157, 0); } }
  .icon-btn { width: 40px; height: 40px; border-radius: 13px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--dim); flex: none; }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Sélecteur partenaire (agence) ---------- */
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: -6px -16px 18px; padding: 0 16px 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 9px 15px; border-radius: 100px; border: 1px solid var(--line); background: var(--card); font-size: 13px; font-weight: 500; color: var(--dim); }
  .chip.on { color: #1a1300; background: var(--gold); border-color: var(--gold); font-weight: 600; }

  /* ---------- Cartes ---------- */
  .card { background: linear-gradient(180deg, var(--card-2), var(--card)); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; position: relative; overflow: hidden; }
  .card.flat { background: var(--card); }
  .eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .eyebrow .r { letter-spacing: 0.4px; text-transform: none; font-weight: 500; color: var(--dimmer); }
  .big { font-family: var(--serif); font-size: 64px; line-height: 0.95; letter-spacing: -1.5px; margin-top: 12px; }
  .big .cur { font-size: 0.5em; color: var(--gold); margin-right: 3px; vertical-align: 0.55em; letter-spacing: 0; }
  .mid { font-family: var(--serif); font-size: 34px; line-height: 1; letter-spacing: -0.5px; }
  .mid .cur { font-size: 0.55em; color: var(--gold); margin-right: 2px; vertical-align: 0.45em; }
  .sub { font-size: 13px; color: var(--dim); margin-top: 10px; line-height: 1.5; }
  .sub b { color: var(--text); font-weight: 600; }
  .hero { padding: 24px 22px 22px; border-color: var(--line-2); }
  .hero::after { content: ''; position: absolute; inset: auto -40% -60% auto; width: 300px; height: 300px; background: radial-gradient(circle, rgba(245, 197, 66, 0.13), transparent 65%); pointer-events: none; }

  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 15px 14px; }
  .stat-l { font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dimmer); }
  .stat-v { font-family: var(--serif); font-size: 27px; margin-top: 8px; letter-spacing: -0.4px; white-space: nowrap; }
  .stat-v small { font-family: 'Inter'; font-size: 12px; color: var(--dim); margin-left: 3px; letter-spacing: 0; }
  .stat-n { font-size: 11.5px; color: var(--dim); margin-top: 4px; }
  .stats { margin-bottom: 14px; }

  .pill { white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 100px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.2px; }
  .pill.ahead, .pill.done { background: var(--green-soft); color: var(--green); }
  .pill.behind { background: var(--red-soft); color: var(--red); }
  .pill.ontrack { background: var(--gold-soft); color: var(--gold); }
  .pill.none { background: var(--line); color: var(--dim); }
  .pill.wait { background: var(--blue-soft); color: var(--blue); }

  /* ---------- Progression ---------- */
  .prog { margin-top: 18px; }
  .bar { height: 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); position: relative; overflow: visible; }
  .bar-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #B8860B, var(--gold) 60%, var(--gold-2)); box-shadow: 0 0 18px rgba(245, 197, 66, 0.35); transition: width 1s cubic-bezier(.2, .8, .2, 1); max-width: 100%; }
  .bar-mark { position: absolute; top: -5px; width: 2px; height: 20px; background: var(--text); opacity: 0.6; border-radius: 2px; }
  .bar-legend { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); margin-top: 10px; }
  .bar-legend b { color: var(--text); font-weight: 600; }

  /* ---------- Lignes ---------- */
  .list { margin-top: 10px; }
  .li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .li:first-child { border-top: 0; }
  .li-ico { width: 36px; height: 36px; border-radius: 12px; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--gold-soft); color: var(--gold); }
  .li-ico.pu { background: var(--green-soft); color: var(--green); }
  .li-ico.rf { background: var(--blue-soft); color: var(--blue); }
  .li-main { flex: 1; min-width: 0; }
  .li-t { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li-s { font-size: 11.5px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li-v { text-align: right; flex: none; }
  .li-v .a { font-size: 14px; font-weight: 600; }
  .li-v .b { font-size: 11px; margin-top: 3px; }
  .st-debloquee { color: var(--green); } .st-attente { color: var(--blue); } .st-annulee { color: var(--red); } .st-x { color: var(--dim); }
  .kv { display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .kv:first-of-type { border-top: 0; }
  .kv .k { color: var(--dim); }
  .kv .v { font-weight: 600; }
  .kv.total { border-top: 1px solid var(--line-2); padding-top: 14px; }
  .kv.total .k { color: var(--text); font-weight: 600; }
  .kv.total .v { font-family: var(--serif); font-size: 26px; font-weight: 400; color: var(--gold); }
  .tag { font-size: 10.5px; padding: 3px 8px; border-radius: 100px; background: var(--gold-soft); color: var(--gold); margin-left: 6px; font-weight: 600; vertical-align: 1px; }

  /* ---------- Graphiques ---------- */
  .chart { margin-top: 16px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .axis { font-size: 9px; fill: var(--dimmer); font-family: 'Inter'; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--dim); margin-top: 12px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
  .tip { position: fixed; z-index: 50; pointer-events: none; background: #0B1020; border: 1px solid var(--line-2); border-radius: 12px; padding: 9px 12px; font-size: 12px; line-height: 1.5; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); opacity: 0; transition: opacity .12s; white-space: nowrap; }
  .tip b { color: var(--gold); }

  /* ---------- Funnel ---------- */
  .steps { margin-top: 14px; }
  .step { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 13px 0; border-top: 1px solid var(--line); }
  .step:first-child { border-top: 0; }
  .step-t { font-size: 13.5px; color: var(--dim); }
  .step-v { font-family: var(--serif); font-size: 24px; text-align: right; }
  .step-bar { grid-column: 1 / -1; height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.05); overflow: hidden; }
  .step-bar > div { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #B8860B, var(--gold)); }
  .step-r { grid-column: 1 / -1; font-size: 11.5px; color: var(--dimmer); }
  .warn { display: flex; gap: 10px; align-items: flex-start; background: var(--red-soft); border: 1px solid rgba(255, 92, 108, 0.25); color: #FFC2C8; border-radius: 16px; padding: 13px 14px; font-size: 13px; line-height: 1.45; margin-bottom: 14px; }
  .warn.soft { background: var(--blue-soft); border-color: rgba(122, 162, 255, 0.25); color: #CFDDFF; }
  .warn .ic { flex: none; font-size: 15px; line-height: 1.2; }

  /* ---------- Tableaux ---------- */
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { padding: 6px 11px; border-radius: 9px; font-size: 12px; color: var(--dim); font-weight: 500; }
  .seg button.on { background: var(--line-2); color: var(--text); }
  .tbl { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13px; }
  .tbl th { text-align: right; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--dimmer); font-weight: 600; padding: 8px 4px; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .tbl td { text-align: right; padding: 11px 4px; border-top: 1px solid var(--line); white-space: nowrap; }
  .tbl td.g { color: var(--gold); font-weight: 600; }
  .tbl tr.cur td { background: rgba(245, 197, 66, 0.04); }

  /* ---------- Agence ---------- */
  .pcard { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-top: 10px; }
  .pcard-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pcard-n { font-family: var(--serif); font-size: 22px; }
  .pcard-b { display: block; font-size: 11px; color: var(--dimmer); margin-top: 2px; letter-spacing: 0.3px; }
  .pcard-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 10px; }
  .pcard-row b { color: var(--text); font-weight: 600; }
  .pcard .bar { height: 6px; margin-top: 10px; }
  .anom { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .anom:first-child { border-top: 0; }
  .anom-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; }
  .anom-dot.g3 { background: var(--red); } .anom-dot.g2 { background: var(--gold); }
  .anom-t { font-size: 13.5px; font-weight: 500; }
  .anom-s { font-size: 12px; color: var(--dim); margin-top: 3px; line-height: 1.4; }
  .more { width: 100%; padding: 12px; margin-top: 6px; font-size: 12.5px; color: var(--gold); font-weight: 600; border-top: 1px solid var(--line); }

  /* ---------- Navigation ---------- */
  .nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 20; display: flex; gap: 4px; padding: 6px; border-radius: 22px; background: rgba(13, 18, 34, 0.82); border: 1px solid var(--line-2); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); width: min(440px, calc(100% - 28px)); }
  .nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 4px 8px; border-radius: 16px; font-size: 10.5px; font-weight: 500; color: var(--dimmer); transition: color .2s, background .2s; }
  .nav button svg { width: 20px; height: 20px; }
  .nav button.on { color: var(--gold); background: var(--gold-soft); }

  .page { display: none; animation: rise .35s cubic-bezier(.2, .8, .2, 1); }
  .page.on { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .skel { color: transparent !important; background: linear-gradient(90deg, var(--line) 0%, var(--line-2) 50%, var(--line) 100%); background-size: 200% 100%; animation: sh 1.4s infinite; border-radius: 10px; }
  @keyframes sh { to { background-position: -200% 0; } }
  .empty { text-align: center; color: var(--dim); font-size: 13px; padding: 22px 0 8px; }
  .foot { text-align: center; font-size: 11px; color: var(--dimmer); margin-top: 22px; line-height: 1.6; }
  .err { text-align: center; padding: 70px 20px; }
  .err h2 { font-family: var(--serif); font-weight: 400; font-size: 32px; margin-bottom: 10px; }
  .err p { color: var(--dim); font-size: 14px; line-height: 1.5; }
  .banner { font-size: 12px; color: var(--dim); text-align: center; margin: -10px 0 14px; }
  .banner.stale { color: var(--gold); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <div class="avatar" id="avatar">·</div>
      <div class="who">
        <div class="who-name" id="who-name">Chargement</div>
        <div class="who-sub" id="who-sub"><span class="live-dot off"></span>Connexion aux données…</div>
      </div>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Actualiser" onclick="load(true)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>
  <div id="chips" class="chips" hidden></div>
  <div id="banner" class="banner" hidden></div>
  <main id="pages">
    <section class="page on" data-page="agence" id="p-agence"></section>
    <section class="page" data-page="jour" id="p-jour">
      <div class="card hero"><div class="eyebrow">Aujourd'hui</div><div class="big skel">0 000</div><div class="sub skel">&nbsp;</div></div>
      <div class="row stats"><div class="stat skel" style="height:96px"></div><div class="stat skel" style="height:96px"></div></div>
      <div class="card skel" style="height:220px"></div>
    </section>
    <section class="page" data-page="mois" id="p-mois"></section>
    <section class="page" data-page="funnel" id="p-funnel"></section>
    <section class="page" data-page="histo" id="p-histo"></section>
  </main>
  <div class="foot" id="foot"></div>
</div>

<nav class="nav" id="nav">
  <button data-go="agence" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Agence</button>
  <button data-go="jour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd'hui</button>
  <button data-go="mois"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Mois</button>
  <button data-go="funnel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>Funnel</button>
  <button data-go="histo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Historique</button>
</nav>
<div class="tip" id="tip"></div>

<script>
// ============================================================================
// ÉTAT
// ============================================================================
const Q = new URLSearchParams(location.search);
const ADMIN = Q.get('admin');
const TOKEN = Q.get('p');
const API = '/api/data' + (ADMIN ? '?admin=' + encodeURIComponent(ADMIN) : TOKEN ? '?p=' + encodeURIComponent(TOKEN) : '');
const CACHE_KEY = 'bena_v2:' + (ADMIN ? 'agence' : (TOKEN || 'defaut'));
const REFRESH_MS = 60000;
const S = { data: null, view: null, page: ADMIN ? 'agence' : 'jour', partnerIdx: -1, depFilter: 'tous', depLimit: 12, histoMode: 'mois', funnelDays: 14, anomLimit: 6, stale: false };

// ============================================================================
// FORMATS
// ============================================================================
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_C = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const JOURS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const n0 = n => Math.round(n || 0).toLocaleString('fr-FR').replace(/ | /g, ' ');
const money = n => '$' + n0(n);
const bigMoney = n => '<span class="cur">$</span>' + n0(n);
const pctf = n => (isFinite(n) ? Math.round(n) : 0) + ' %';
const dParts = s => s.split('-').map(Number);
const dObj = s => { const [y, m, d] = dParts(s); return new Date(y, m - 1, d); };
const dShort = s => { const [, m, d] = dParts(s); return d + ' ' + MOIS_C[m - 1]; };
const dDay = s => { const o = dObj(s); return JOURS[o.getDay()] + ' ' + o.getDate() + ' ' + MOIS_C[o.getMonth()]; };
const dNum = s => { const [, m, d] = dParts(s); return String(d).padStart(2, '0') + '/' + String(m).padStart(2, '0'); };
const monthName = key => { const [y, m] = key.split('-').map(Number); return MOIS[m - 1] + ' ' + y; };
const monthShort = key => { const [, m] = key.split('-').map(Number); return MOIS_C[m - 1]; };
const daysAgo = (a, b) => Math.round((dObj(b) - dObj(a)) / 86400000);
const brokerIco = b => b === 'PUPrime' ? '<div class="li-ico pu">PU</div>' : b === 'RaiseFX' ? '<div class="li-ico rf">RF</div>' : '<div class="li-ico">AX</div>';
const short = n => String(n || '').replace(/\s*\(.*\)\s*/, '').trim() || n;
const brandOf = n => { const m = String(n || '').match(/\((.*)\)/); return m ? m[1] : ''; };
const statusTxt = { debloquee: 'Débloquée', attente: 'En attente', annulee: 'Annulée' };
const pillArrow = { ahead: '↑', behind: '↓', ontrack: '→', done: '★', none: '·' };
function pill(st) {
  if (!st) return '';
  const diff = st.code === 'ahead' || st.code === 'behind' ? ' ' + Math.round(Math.abs(st.diff)) + ' pts' : '';
  return '<span class="pill ' + st.code + '">' + pillArrow[st.code] + ' ' + esc(st.label) + diff + '</span>';
}

// ============================================================================
// CHARGEMENT
// ============================================================================
function readCache() { try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); return c && c.data ? c : null; } catch (e) { return null; } }
function writeCache(data) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), data })); } catch (e) {} }

async function load(manual) {
  const btn = document.getElementById('refresh');
  btn.classList.add('spin');
  try {
    const res = await fetch(API, { cache: 'no-store' });
    const json = await res.json();
    if (!res.ok) throw Object.assign(new Error(json.error || 'Erreur'), { status: res.status, detail: json.detail });
    S.data = json; S.stale = false; writeCache(json);
    render();
  } catch (e) {
    const c = readCache();
    if (c && !S.data) { S.data = c.data; S.stale = true; S.staleAt = c.at; render(); }
    else if (S.data) { S.stale = true; S.staleAt = S.staleAt || Date.now(); renderHeader(); }
    else showError(e);
  } finally { setTimeout(() => btn.classList.remove('spin'), 300); }
}

function showError(e) {
  document.getElementById('pages').innerHTML = '<div class="err"><h2>' + (e.status === 404 ? 'Lien inconnu' : e.status === 403 ? 'Accès refusé' : 'Données indisponibles') + '</h2><p>' +
    (e.status === 404 ? 'Ce lien ne correspond à aucun partenaire actif. Demande ton lien à jour à Paul.' :
     e.status === 403 ? 'La clé de cet espace n\'est pas valide.' :
     'Impossible de lire les données pour le moment. Réessaie dans un instant.') + '</p></div>';
  document.getElementById('nav').hidden = true;
  document.getElementById('who-name').textContent = 'Dashboard';
  document.getElementById('who-sub').innerHTML = '<span class="live-dot off"></span>Hors ligne';
}

// ============================================================================
// RENDU
// ============================================================================
function current() {
  const d = S.data;
  if (!d) return null;
  if (d.mode === 'agence') return S.partnerIdx >= 0 ? d.partners[S.partnerIdx] : null;
  return d;
}

function render() {
  const d = S.data;
  const isAgency = d.mode === 'agence';
  document.querySelector('[data-go="agence"]').hidden = !isAgency;
  if (isAgency && S.partnerIdx < 0 && S.page !== 'agence') S.partnerIdx = 0;
  renderHeader();
  renderChips();
  if (isAgency) renderAgency();
  const p = current() || (isAgency ? d.partners[0] : null);
  if (p) { renderJour(p, isAgency); renderMois(p, isAgency); renderFunnel(p); renderHisto(p, isAgency); }
  go(S.page, true);
  document.getElementById('foot').innerHTML = 'Mis à jour ' + new Date(d.generatedAt).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) +
    ' · CA = commissions débloquées<br>Lecture ' + (d.source === 'privé' ? 'sécurisée (compte de service)' : 'publique') ;
}

function renderHeader() {
  const d = S.data;
  const isAgency = d.mode === 'agence';
  const p = current();
  const name = isAgency && S.page === 'agence' ? 'Incubeo' : (p ? p.partner.name : 'Incubeo');
  document.getElementById('who-name').textContent = name;
  document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();
  document.title = name + ' — Dashboard';
  const today = d.today;
  document.getElementById('who-sub').innerHTML = '<span class="live-dot' + (S.stale ? ' off' : '') + '"></span>' +
    (isAgency && S.page === 'agence' ? 'Espace agence · ' : '') + dDay(today);
  const b = document.getElementById('banner');
  if (S.stale) { b.hidden = false; b.className = 'banner stale'; b.textContent = 'Hors ligne — chiffres du ' + new Date(S.staleAt).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  else b.hidden = true;
}

function renderChips() {
  const d = S.data, el = document.getElementById('chips');
  if (d.mode !== 'agence' || S.page === 'agence') { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = d.partners.map((p, i) => '<button class="chip' + (i === S.partnerIdx ? ' on' : '') + '" data-pi="' + i + '">' + esc(short(p.partner.name)) + '</button>').join('');
  el.querySelectorAll('[data-pi]').forEach(b => b.onclick = () => { S.partnerIdx = +b.dataset.pi; S.depLimit = 12; render(); window.scrollTo({ top: 0 }); });
}

// ---------- AUJOURD'HUI ----------
function renderJour(p, isAgency) {
  const j = p.jour, q = p.quinzaine;
  const prog = q.objectif ? Math.min(100, q.ca / q.objectif * 100) : 0;
  const expected = q.ecoules / q.jours * 100;
  const deltaHier = j.ca - j.hier;
  let html = '';
  html += '<div class="card hero">' +
    '<div class="eyebrow">Aujourd\'hui <span class="r">' + dDay(p.today) + '</span></div>' +
    '<div class="big">' + bigMoney(j.ca) + '</div>' +
    '<div class="sub">' + (j.depots.filter(x => x.statut === 'debloquee').length) + ' dépôt(s) débloqué(s) · hier <b>' + money(j.hier) + '</b>' +
    (j.ca || j.hier ? ' <span style="color:' + (deltaHier >= 0 ? 'var(--green)' : 'var(--red)') + '">' + (deltaHier >= 0 ? '+' : '−') + money(Math.abs(deltaHier)) + '</span>' : '') +
    (j.attente ? '<br><span class="st-attente">+ ' + money(j.attente) + ' en attente de validation</span>' : '') + '</div>' +
    '</div>';

  html += '<div class="card">' +
    '<div class="eyebrow">Quinzaine · ' + dShort(q.start) + ' → ' + dShort(q.end) + ' ' + pill(q.statut) + '</div>' +
    '<div style="display:flex;align-items:baseline;gap:10px;margin-top:14px"><div class="mid">' + bigMoney(q.ca) + '</div><div style="color:var(--dim);font-size:13px">/ ' + money(q.objectif) + '</div></div>' +
    '<div class="prog"><div class="bar"><div class="bar-fill" style="width:' + prog + '%"></div><div class="bar-mark" style="left:calc(' + Math.min(100, expected) + '% - 1px)"></div></div>' +
    '<div class="bar-legend"><span><b>' + pctf(q.ca / (q.objectif || 1) * 100) + '</b> de l\'objectif</span><span>Jour ' + q.ecoules + ' / ' + q.jours + '</span></div></div>' +
    '</div>';

  html += '<div class="row stats">' +
    stat('Il faut / jour', money(q.rythmeNecessaire), q.ca >= q.objectif ? 'Objectif atteint' : 'pour finir à ' + money(q.objectif)) +
    stat('Projection', money(q.projection), 'au rythme actuel') + '</div>';
  html += '<div class="row stats">' +
    stat('Dépôts', q.depots + '', 'débloqués sur la quinzaine') +
    stat('En attente', money(q.attente), q.attente ? 'non comptés dans le CA' : 'rien en attente') + '</div>';
  if (isAgency) {
    html += '<div class="card flat"><div class="eyebrow">Encaissement de cette quinzaine</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px"><div class="mid">' + bigMoney(q.ca) + '</div><div style="color:var(--dim);font-size:13px">le ' + dDay(q.encaissement) + '</div></div>' +
      '<div class="sub">Montant à date, payé par les brokers. Il évoluera jusqu\'au ' + dShort(q.end) + '.</div></div>';
  }
  html += depositsCard(p);
  document.getElementById('p-jour').innerHTML = html;
  bindDeposits(p, isAgency);
}

function stat(l, v, n) { return '<div class="stat"><div class="stat-l">' + l + '</div><div class="stat-v">' + v + '</div><div class="stat-n">' + n + '</div></div>'; }

function depositsCard(p) {
  const f = S.depFilter;
  const all = p.depots.filter(x => f === 'tous' || x.statut === f);
  const list = all.slice(0, S.depLimit);
  return '<div class="card" id="dep-card"><div class="eyebrow">Derniers dépôts <span class="r">' + all.length + '</span></div><div class="seg" style="margin-top:12px">' +
    ['tous', 'debloquee', 'attente', 'annulee'].map(k => '<button data-df="' + k + '" class="' + (f === k ? 'on' : '') + '">' + (k === 'tous' ? 'Tous' : k === 'debloquee' ? 'Débloqués' : k === 'attente' ? 'Attente' : 'Annulés') + '</button>').join('') +
    '</div><div class="list">' +
    (list.length ? list.map(x => '<div class="li">' + brokerIco(x.broker) +
      '<div class="li-main"><div class="li-t">' + esc(x.name) + '</div><div class="li-s">' + dShort(x.date) + ' · ' + esc(x.broker) + (x.depot ? ' · dépôt ' + money(x.depot) : '') + (x.setter ? ' · ' + esc(x.setter) : '') + '</div></div>' +
      '<div class="li-v"><div class="a">' + money(x.commission) + '</div><div class="b st-' + (x.statut || 'x') + '">' + esc(statusTxt[x.statut] || x.statutLabel || '—') + '</div></div></div>').join('')
      : '<div class="empty">Aucun dépôt</div>') +
    '</div>' + (all.length > list.length ? '<button class="more" data-more="1">Voir plus (' + (all.length - list.length) + ')</button>' : '') + '</div>';
}
function bindDeposits(p, isAgency) {
  const card = document.getElementById('dep-card');
  card.querySelectorAll('[data-df]').forEach(b => b.onclick = () => { S.depFilter = b.dataset.df; S.depLimit = 12; renderJour(p, isAgency); });
  const m = card.querySelector('[data-more]');
  if (m) m.onclick = () => { S.depLimit += 20; renderJour(p, isAgency); };
}

// ---------- MOIS ----------
function renderMois(p, isAgency) {
  const m = p.mois;
  const prog = m.objectif ? Math.min(100, m.ca / m.objectif * 100) : 0;
  const expected = m.ecoules / m.jours * 100;
  let html = '<div class="card hero"><div class="eyebrow">' + monthName(m.key) + ' ' + pill(m.statut) + '</div>' +
    '<div class="big">' + bigMoney(m.ca) + '</div>' +
    '<div class="sub">Objectif du mois <b>' + money(m.objectif) + '</b> · ' + m.depots + ' dépôts débloqués' +
    (m.attente ? '<br><span class="st-attente">+ ' + money(m.attente) + ' en attente</span>' : '') + '</div>' +
    '<div class="prog"><div class="bar"><div class="bar-fill" style="width:' + prog + '%"></div><div class="bar-mark" style="left:calc(' + Math.min(100, expected) + '% - 1px)"></div></div>' +
    '<div class="bar-legend"><span><b>' + pctf(m.ca / (m.objectif || 1) * 100) + '</b> atteint</span><span>Jour ' + m.ecoules + ' / ' + m.jours + '</span></div></div></div>';

  html += '<div class="row stats">' + stat('Projection', money(m.projection), 'fin ' + MOIS[dParts(m.start)[1] - 1]) +
    stat('Il faut / jour', money(m.rythmeNecessaire), 'sur ' + (m.jours - m.ecoules + 1) + ' jours') + '</div>';

  // Rémunération
  html += '<div class="grid-2"><div class="card"><div class="eyebrow">Rémunération du mois <span class="r">calcul mensuel</span></div><div class="list" style="margin-top:8px">' +
    kv('CA débloqué', money(m.ca)) +
    kv('Frais', '− ' + money(m.frais), isAgency ? fraisDetail(p) : '') +
    kv('Bénéfice net', money(m.benefice)) +
    '<div class="kv total"><span class="k">Part ' + esc(p.partner.name) + (m.minimumApplique ? '<span class="tag">minimum garanti</span>' : '') + '</span><span class="v">' + money(m.partner) + '</span></div>' +
    (isAgency ? kv('Marge agence', money(m.agence)) : '') +
    '</div><div class="sub" style="font-size:12px">' + Math.round(p.params.pctPartner * 100) + ' % du bénéfice net, minimum ' + money(p.params.minMensuel) + ' par mois.</div></div>';

  // Comparaison mois précédent
  const prev = m.precedent;
  const ev = prev.ca ? (m.ca / (m.ecoules / m.jours) - prev.ca) / prev.ca * 100 : null;
  html += '<div class="card flat"><div class="eyebrow">' + monthName(prev.key) + ' <span class="r">mois précédent</span></div><div class="list" style="margin-top:8px">' +
    kv('CA débloqué', money(prev.ca)) + kv('Part ' + esc(short(p.partner.name)), money(prev.partner)) + (isAgency ? kv('Marge agence', money(prev.agence)) : '') +
    '</div>' + (ev !== null ? '<div class="sub">Au rythme actuel, ce mois finirait à <b style="color:' + (ev >= 0 ? 'var(--green)' : 'var(--red)') + '">' + (ev >= 0 ? '+' : '') + Math.round(ev) + ' %</b> par rapport à ' + MOIS[dParts(prev.key + '-01')[1] - 1] + '.</div>' : '') + '</div></div>';

  // Graph quinzaine
  const days = p.quinzaine.jours_detail;
  html += '<div class="card"><div class="eyebrow">Quinzaine jour par jour <span class="r">' + dShort(p.quinzaine.start) + ' → ' + dShort(p.quinzaine.end) + '</span></div>' +
    '<div class="chart" id="chart-q"></div><div class="legend"><span><i style="background:var(--gold)"></i>Débloqué</span><span><i style="background:var(--blue)"></i>En attente</span><span><i style="background:var(--text);opacity:.5;height:2px"></i>Rythme objectif</span></div></div>';
  document.getElementById('p-mois').innerHTML = html;
  barChart('chart-q', days.map(x => ({ label: String(dParts(x.date)[2]), a: x.ca, b: x.attente, future: x.date > p.today, tip: dDay(x.date) + '<br><b>' + money(x.ca) + '</b> débloqué' + (x.attente ? '<br>' + money(x.attente) + ' en attente' : '') + '<br>' + x.depots + ' dépôt(s)' })),
    p.quinzaine.objectif / p.quinzaine.jours);
}
function kv(k, v, extra) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>' + (extra || ''); }
function fraisDetail(p) {
  const m = p.mois, pr = p.params;
  const items = pr.fixes.map(f => esc(f.label) + ' ' + n0(f.eur) + ' €').concat(pr.variables.map(v => esc(v.label) + ' (' + money(m.fraisVariables) + ')'));
  return items.length ? '<div style="font-size:11.5px;color:var(--dimmer);margin:-6px 0 4px">' + items.join(' · ') + '</div>' : '';
}

// ---------- FUNNEL ----------
function renderFunnel(p) {
  const N = S.funnelDays;
  const days = p.funnel.jours.slice(-N);
  const sum = k => days.reduce((s, x) => s + (x[k] || 0), 0);
  const heures = sum('heures'), lives = sum('lives'), viewers = sum('viewers'), followers = sum('followers'), ajouts = sum('ajouts'), depots = sum('depots'), ca = sum('ca');
  const maxV = Math.max(heures ? 1 : 0, 1);
  let html = '';
  const tgAge = p.funnel.derniereSaisieTelegram ? daysAgo(p.funnel.derniereSaisieTelegram, p.today) : null;
  const lvAge = p.funnel.derniereSaisieLive ? daysAgo(p.funnel.derniereSaisieLive, p.today) : null;
  const src = p.sources || {};
  if (src.live && /impossible|refus/.test(src.live)) html += '<div class="warn soft"><span class="ic">●</span><div><b>Live Tracking pas encore connecté.</b> Le fichier n\'est pas lisible par le dashboard : il le sera dès que le compte de service sera branché.</div></div>';
  else if (lvAge === null || lvAge > 2) html += '<div class="warn"><span class="ic">●</span><div><b>Live Tracking ' + (lvAge === null ? 'jamais rempli' : 'pas rempli depuis ' + lvAge + ' jours') + '.</b> Sans les lives, on ne sait pas ce qui génère les dépôts.</div></div>';
  if (src.telegram && /impossible|refus/.test(src.telegram)) html += '<div class="warn soft"><span class="ic">●</span><div><b>Telegram Tracking pas encore connecté.</b> Même raison : accès en attente du compte de service.</div></div>';
  else if (tgAge === null || tgAge > 2) html += '<div class="warn soft"><span class="ic">●</span><div><b>Telegram ' + (tgAge === null ? 'jamais rempli' : 'pas rempli depuis ' + tgAge + ' jours') + '.</b> Les ajouts du canal manquent pour mesurer la conversion.</div></div>';

  html += '<div class="card"><div class="eyebrow">Du live au dépôt <span class="seg">' + [7, 14, 30].map(k => '<button data-fd="' + k + '" class="' + (N === k ? 'on' : '') + '">' + k + ' j</button>').join('') + '</span></div><div class="steps">' +
    step('Heures de live', heures.toFixed(1).replace('.', ',') + ' h', 1, lives + ' live(s) · ' + n0(viewers) + ' viewers · ' + n0(followers) + ' followers') +
    step('Ajouts Telegram', n0(ajouts), 1, viewers ? (ajouts / viewers * 100).toFixed(1).replace('.', ',') + ' % des viewers' : (p.funnel.membres ? n0(p.funnel.membres) + ' membres dans le canal' : '—')) +
    step('Dépôts débloqués', n0(depots), ajouts ? Math.min(1, depots / ajouts * 10) : 0, ajouts ? (depots / ajouts * 100).toFixed(1).replace('.', ',') + ' dépôts pour 100 ajouts' : '—') +
    step('CA débloqué', money(ca), 1, heures ? money(ca / heures) + ' par heure de live' : depots ? money(ca / depots) + ' par dépôt' : '—') +
    '</div></div>';

  html += '<div class="card"><div class="eyebrow">Jour par jour <span class="r">' + N + ' derniers jours</span></div><div class="chart" id="chart-f"></div>' +
    '<div class="legend"><span><i style="background:var(--gold)"></i>CA débloqué</span><span><i style="background:var(--green)"></i>Ajouts Telegram</span><span><i style="background:var(--blue)"></i>Heures de live</span></div></div>';
  document.getElementById('p-funnel').innerHTML = html;
  document.querySelectorAll('[data-fd]').forEach(b => b.onclick = () => { S.funnelDays = +b.dataset.fd; renderFunnel(p); });
  comboChart('chart-f', days);
}
function step(t, v, ratio, r) { return '<div class="step"><div class="step-t">' + t + '</div><div class="step-v">' + v + '</div><div class="step-r">' + r + '</div></div>'; }

// ---------- HISTORIQUE ----------
function renderHisto(p, isAgency) {
  const mode = S.histoMode;
  let html = '<div class="card"><div class="eyebrow">CA débloqué <span class="seg"><button data-hm="mois" class="' + (mode === 'mois' ? 'on' : '') + '">Mois</button><button data-hm="q" class="' + (mode === 'q' ? 'on' : '') + '">Quinzaines</button></span></div><div class="chart" id="chart-h"></div></div>';
  if (mode === 'mois') {
    html += '<div class="card flat"><table class="tbl"><thead><tr><th>Mois</th><th>CA</th><th>Dépôts</th><th>Part ' + esc(p.partner.name) + '</th>' + (isAgency ? '<th>Agence</th>' : '') + '</tr></thead><tbody>' +
      p.historique.mois.slice().reverse().map(x => '<tr class="' + (x.key === p.mois.key ? 'cur' : '') + '"><td>' + monthShort(x.key) + ' ' + x.key.slice(2, 4) + '</td><td class="g">' + money(x.ca) + '</td><td>' + x.depots + '</td><td>' + money(x.partner) + '</td>' + (isAgency ? '<td>' + money(x.agence) + '</td>' : '') + '</tr>').join('') +
      '</tbody></table></div>';
  } else {
    html += '<div class="card flat"><table class="tbl"><thead><tr><th>Quinzaine</th><th>CA</th><th>Attente</th><th>Dépôts</th>' + (isAgency ? '<th>Payé le</th>' : '') + '</tr></thead><tbody>' +
      p.historique.quinzaines.slice().reverse().map(x => '<tr class="' + (x.key === p.quinzaine.key ? 'cur' : '') + '"><td>' + dNum(x.start) + '–' + dNum(x.end) + '</td><td class="g">' + money(x.ca) + '</td><td>' + (x.attente ? money(x.attente) : '—') + '</td><td>' + x.depots + '</td>' + (isAgency ? '<td>' + dNum(x.payout) + '</td>' : '') + '</tr>').join('') +
      '</tbody></table></div>';
  }
  document.getElementById('p-histo').innerHTML = html;
  document.querySelectorAll('[data-hm]').forEach(b => b.onclick = () => { S.histoMode = b.dataset.hm; renderHisto(p, isAgency); });
  const src = mode === 'mois' ? p.historique.mois : p.historique.quinzaines;
  barChart('chart-h', src.map(x => ({ label: mode === 'mois' ? monthShort(x.key) : dNum(x.start).slice(0, 2) + '/' + dNum(x.start).slice(3), a: x.ca, b: x.attente || 0, current: mode === 'mois' ? x.key === p.mois.key : x.key === p.quinzaine.key,
    tip: (mode === 'mois' ? monthName(x.key) : dShort(x.start) + ' → ' + dShort(x.end)) + '<br><b>' + money(x.ca) + '</b> débloqué' + (x.attente ? '<br>' + money(x.attente) + ' en attente' : '') + '<br>' + x.depots + ' dépôt(s)' })),
    mode === 'mois' ? p.params.objectifMois : p.params.objectifQuinzaine, true);
}

// ---------- AGENCE ----------
function renderAgency() {
  const d = S.data, t = d.total;
  const prog = t.objectif ? Math.min(100, t.ca / t.objectif * 100) : 0;
  const m0 = d.partners[0] ? d.partners[0].mois : null;
  const expected = m0 ? m0.ecoules / m0.jours * 100 : 0;
  let html = '<div class="card hero"><div class="eyebrow">' + (m0 ? monthName(m0.key) : 'Ce mois') + ' · tous partenaires</div>' +
    '<div class="big">' + bigMoney(t.ca) + '</div>' +
    '<div class="sub">Objectif cumulé <b>' + money(t.objectif) + '</b> · aujourd\'hui <b>' + money(t.caJour) + '</b>' + (t.attente ? '<br><span class="st-attente">+ ' + money(t.attente) + ' en attente</span>' : '') + '</div>' +
    '<div class="prog"><div class="bar"><div class="bar-fill" style="width:' + prog + '%"></div><div class="bar-mark" style="left:calc(' + Math.min(100, expected) + '% - 1px)"></div></div>' +
    '<div class="bar-legend"><span><b>' + pctf(t.ca / (t.objectif || 1) * 100) + '</b> atteint</span><span>' + (m0 ? 'Jour ' + m0.ecoules + ' / ' + m0.jours : '') + '</span></div></div></div>';

  html += '<div class="row stats">' + stat('Marge agence', money(t.agence), 'après frais et partenaires') + stat('Partenaires', money(t.partenaires), 'à reverser ce mois') + '</div>';

  html += '<div class="grid-2"><div class="card"><div class="eyebrow">Partenaires <span class="r">CA du mois</span></div>' +
    d.partners.map((p, i) => {
      const m = p.mois, pr = m.objectif ? Math.min(100, m.ca / m.objectif * 100) : 0;
      return '<button class="pcard" data-open="' + i + '"><div class="pcard-h"><span><span class="pcard-n">' + esc(short(p.partner.name)) + '</span>' + (brandOf(p.partner.name) ? '<span class="pcard-b">' + esc(brandOf(p.partner.name)) + '</span>' : '') + '</span>' + pill(m.statut) + '</div>' +
        '<div class="bar"><div class="bar-fill" style="width:' + pr + '%"></div><div class="bar-mark" style="left:calc(' + Math.min(100, m.ecoules / m.jours * 100) + '% - 1px)"></div></div>' +
        '<div class="pcard-row"><span><b>' + money(m.ca) + '</b> / ' + money(m.objectif) + '</span><span>' + (m.attente ? '<span class="st-attente">' + money(m.attente) + ' en attente</span>' : m.depots + ' dépôts') + '</span></div>' +
        '<div class="pcard-row"><span>Aujourd\'hui <b>' + money(p.jour.ca) + '</b></span><span>Marge <b>' + money(m.agence) + '</b></span></div></button>';
    }).join('') + '</div>';

  html += '<div class="card"><div class="eyebrow">Encaissements à venir <span class="r">brokers</span></div><div class="list">' +
    (d.encaissements.length ? d.encaissements.map(e => '<div class="li"><div class="li-ico">' + dParts(e.date)[2] + '</div><div class="li-main"><div class="li-t">' + dDay(e.date) + (e.enCours ? '<span class="tag">en cours</span>' : '') + '</div><div class="li-s">' +
      'Quinzaine ' + dNum(e.start) + '–' + dNum(e.end) + ' · ' + e.detail.filter(x => x.montant || x.attente).map(x => esc(x.partner) + ' ' + money(x.montant)).join(', ') + '</div></div>' +
      '<div class="li-v"><div class="a">' + money(e.montant) + '</div>' + (e.attente ? '<div class="b st-attente">+ ' + money(e.attente) + ' attente</div>' : '') + '</div></div>').join('') : '<div class="empty">Rien à encaisser</div>') +
    '</div></div></div>';

  const an = d.anomalies;
  html += '<div class="card"><div class="eyebrow">À vérifier <span class="r">' + an.length + ' point(s)</span></div><div class="list">' +
    (an.length ? an.slice(0, S.anomLimit).map(a => '<div class="anom"><div class="anom-dot g' + a.gravite + '"></div><div><div class="anom-t">' + esc(a.name) + ' · ' + money(a.montant) + '</div><div class="anom-s">' + esc(a.texte) + '<br>' + esc(a.partner) + ' · ' + esc(a.broker) + ' · ' + dShort(a.date) + '</div></div></div>').join('') : '<div class="empty">Tout est propre</div>') +
    '</div>' + (an.length > S.anomLimit ? '<button class="more" id="anom-more">Voir les ' + (an.length - S.anomLimit) + ' autres</button>' : '') + '</div>';
  document.getElementById('p-agence').innerHTML = html;
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { S.partnerIdx = +b.dataset.open; go('jour'); });
  const more = document.getElementById('anom-more');
  if (more) more.onclick = () => { S.anomLimit = 999; renderAgency(); };
}

// ============================================================================
// GRAPHIQUES (SVG)
// ============================================================================
const tipEl = document.getElementById('tip');
function bindTips(el) {
  el.querySelectorAll('[data-tip]').forEach(g => {
    const show = e => { tipEl.innerHTML = g.dataset.tip; tipEl.style.opacity = 1; const pt = e.touches ? e.touches[0] : e; const w = tipEl.offsetWidth; tipEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, pt.clientX - w / 2)) + 'px'; tipEl.style.top = (pt.clientY - tipEl.offsetHeight - 14) + 'px'; };
    g.addEventListener('mousemove', show); g.addEventListener('touchstart', show, { passive: true });
    g.addEventListener('mouseleave', () => tipEl.style.opacity = 0);
  });
}
document.addEventListener('touchstart', e => { if (!e.target.closest('[data-tip]')) tipEl.style.opacity = 0; }, { passive: true });

function niceMax(v) { if (v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p * 2) / 2 * p; }

function barChart(id, items, target, labelsAll) {
  const el = document.getElementById(id); if (!el) return;
  const W = 340, H = 170, pl = 34, pr = 4, pt = 10, pb = 22;
  const max = niceMax(Math.max(target || 0, ...items.map(x => x.a + x.b)));
  const bw = (W - pl - pr) / items.length, y = v => pt + (H - pt - pb) * (1 - v / max);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
  [0, 0.5, 1].forEach(f => { const v = max * f; s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#1A2140" stroke-width="1"/><text class="axis" x="' + (pl - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + (v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0).replace('.', ',') + 'k' : Math.round(v)) + '</text>'; });
  items.forEach((x, i) => {
    const gx = pl + i * bw, w = Math.max(3, bw * 0.62), bx = gx + (bw - w) / 2;
    const ya = y(x.a), yb = y(x.a + x.b);
    s += '<g data-tip="' + esc(x.tip) + '"><rect x="' + gx + '" y="' + pt + '" width="' + bw + '" height="' + (H - pt - pb) + '" fill="transparent"/>';
    if (x.future) s += '<rect x="' + bx + '" y="' + (H - pb - 2) + '" width="' + w + '" height="2" rx="1" fill="#1A2140"/>';
    if (x.b > 0) s += '<rect x="' + bx + '" y="' + yb + '" width="' + w + '" height="' + Math.max(0, ya - yb) + '" rx="3" fill="#7AA2FF" opacity="0.55"/>';
    if (x.a > 0) s += '<rect x="' + bx + '" y="' + ya + '" width="' + w + '" height="' + Math.max(2, H - pb - ya) + '" rx="4" fill="' + (x.current ? '#FFE08A' : '#F5C542') + '"/>';
    if (labelsAll || items.length <= 16 || i % 2 === 0) s += '<text class="axis" x="' + (gx + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(x.label) + '</text>';
    s += '</g>';
  });
  if (target) s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(target) + '" y2="' + y(target) + '" stroke="#F4F5FA" stroke-opacity="0.5" stroke-dasharray="4 4"/>';
  el.innerHTML = s + '</svg>';
  bindTips(el);
}

function comboChart(id, days) {
  const el = document.getElementById(id); if (!el) return;
  const W = 340, H = 180, pl = 34, pr = 26, pt = 10, pb = 22;
  const maxCa = niceMax(Math.max(...days.map(d => d.ca)));
  const maxAj = Math.max(1, ...days.map(d => d.ajouts));
  const maxH = Math.max(1, ...days.map(d => d.heures));
  const bw = (W - pl - pr) / days.length;
  const y = (v, m) => pt + (H - pt - pb) * (1 - v / m);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
  [0, 0.5, 1].forEach(f => { const v = maxCa * f; s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v, maxCa) + '" y2="' + y(v, maxCa) + '" stroke="#1A2140"/><text class="axis" x="' + (pl - 6) + '" y="' + (y(v, maxCa) + 3) + '" text-anchor="end">' + (v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0).replace('.', ',') + 'k' : Math.round(v)) + '</text>'; });
  s += '<text class="axis" x="' + (W - pr + 6) + '" y="' + (pt + 3) + '" fill="#2EE59D">' + maxAj + '</text>';
  let line = '', hl = '';
  days.forEach((d, i) => {
    const gx = pl + i * bw, w = Math.max(3, bw * 0.55), bx = gx + (bw - w) / 2, cx = gx + bw / 2;
    s += '<g data-tip="' + esc(dDay(d.date) + '<br><b>' + money(d.ca) + '</b> · ' + d.depots + ' dépôt(s)<br>' + d.ajouts + ' ajouts Telegram<br>' + (d.heures ? d.heures.toFixed(1).replace('.', ',') + ' h de live · ' + n0(d.viewers) + ' viewers' : 'pas de live saisi')) + '">' +
      '<rect x="' + gx + '" y="' + pt + '" width="' + bw + '" height="' + (H - pt - pb) + '" fill="transparent"/>';
    if (d.ca > 0) s += '<rect x="' + bx + '" y="' + y(d.ca, maxCa) + '" width="' + w + '" height="' + Math.max(2, H - pb - y(d.ca, maxCa)) + '" rx="3" fill="#F5C542" opacity="0.9"/>';
    if (d.heures > 0) s += '<rect x="' + (cx - 1.5) + '" y="' + (H - pb + 3) + '" width="3" height="3" rx="1.5" fill="#7AA2FF"/><rect x="' + bx + '" y="' + (H - pb - 3) + '" width="' + w + '" height="3" rx="1.5" fill="#7AA2FF" opacity="' + (0.3 + 0.7 * d.heures / maxH) + '"/>';
    if (days.length <= 14 || i % Math.ceil(days.length / 10) === 0) s += '<text class="axis" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + dParts(d.date)[2] + '</text>';
    s += '</g>';
    line += (i ? 'L' : 'M') + cx.toFixed(1) + ' ' + y(d.ajouts, maxAj).toFixed(1);
  });
  s += '<path d="' + line + '" fill="none" stroke="#2EE59D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"/>';
  el.innerHTML = s + '</svg>';
  bindTips(el);
}

// ============================================================================
// NAVIGATION
// ============================================================================
function go(page, silent) {
  if (S.data && S.data.mode !== 'agence' && page === 'agence') page = 'jour';
  const changed = S.page !== page;
  S.page = page;
  if (S.data && S.data.mode === 'agence' && page !== 'agence' && S.partnerIdx < 0) { S.partnerIdx = 0; }
  if (S.data && changed && !silent) { render(); }
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.dataset.page === page));
  document.querySelectorAll('.nav [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === page));
  if (S.data) { renderHeader(); renderChips(); }
  if (!silent) window.scrollTo({ top: 0 });
  try { sessionStorage.setItem('bena_page', page); } catch (e) {}
}
document.querySelectorAll('.nav [data-go]').forEach(b => b.onclick = () => go(b.dataset.go));

// ============================================================================
// DÉMARRAGE
// ============================================================================
(function init() {
  try { const pg = sessionStorage.getItem('bena_page'); if (pg && (pg !== 'agence' || ADMIN)) S.page = pg; } catch (e) {}
  if (!ADMIN && S.page === 'agence') S.page = 'jour';
  go(S.page, true);
  const c = readCache();
  if (c) { S.data = c.data; S.stale = Date.now() - c.at > 5 * 60000; S.staleAt = c.at; render(); }
  load();
  setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
})();
</script>
